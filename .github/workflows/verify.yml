name: Dart CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  dart-verify:
    runs-on: [self-hosted, Linux, X64, pc-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: '3.14.1'
      - run: dart pub get
      - run: dart analyze
      - run: dart test
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.1'
      - name: Test decimal arithmetic compiled to JavaScript
        run: dart test --platform node test/big_decimal_test.dart
